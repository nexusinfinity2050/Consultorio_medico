<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS INFINITY CORPORATION | Sistema de Consultorio Médico</title>
<style>
:root{--navy:#0a1a38;--navy2:#12285a;--teal:#00b3a4;--teal2:#0fd3c0;--blue:#2563eb;--bg:#f2f5fa;--card:#fff;--txt:#17233c;--mut:#6b7a96;--line:#e3e9f3;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--vio:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:272px;background:linear-gradient(180deg,var(--navy),#071228);color:#cfd9ee;position:fixed;top:0;bottom:0;overflow-y:auto;z-index:20;transition:transform .25s}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:#2a3d6b;border-radius:3px}
.brand{padding:18px 18px 14px;border-bottom:1px solid #1f3266;display:flex;gap:12px;align-items:center}
.brand svg{flex:none}
.brand b{display:block;color:#fff;letter-spacing:.14em;font-size:13px;line-height:1.15}
.brand small{color:var(--teal2);font-size:10px;letter-spacing:.2em}
.nav-area{padding:14px 18px 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7f93bd;font-weight:700}
.nav a{display:flex;gap:9px;align-items:center;padding:8px 18px;color:#cfd9ee;text-decoration:none;cursor:pointer;font-size:13px;border-left:3px solid transparent}
.nav a:hover{background:#12285a}
.nav a.on{background:#12285a;border-left-color:var(--teal2);color:#fff}
.nav a i{font-style:normal;font-size:10px;font-weight:700;background:#1f3266;border-radius:5px;padding:2px 5px;min-width:34px;text-align:center;color:var(--teal2)}
.nav a.ai i{background:#3b2a78;color:#d6c7ff}
main{margin-left:272px;flex:1;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.top h1{font-size:17px;flex:1}
.top h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.burger{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 11px;font-size:16px;cursor:pointer}
select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--txt);outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--teal)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
#view{padding:24px 26px 50px}
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2) 60%,#0b5e7a);color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:20px}.hero p{color:#bfd0f0;margin-top:5px;max-width:760px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#e8f0ff;font-size:11.5px;padding:4px 10px;border-radius:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(10,26,56,.04)}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.kl{color:var(--mut);font-size:12px}.kv{font-size:26px;font-weight:700;margin:4px 0}.kd{font-size:12px;color:var(--mut)}.kd.up{color:var(--ok)}.kd.down{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #eef2f8;vertical-align:middle}
tr:hover td{background:#fafcff}
.tw{overflow-x:auto}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.b{background:#e0ecff;color:#1d4ed8}.badge.g{background:#dcfce7;color:#15803d}.badge.y{background:#fef3c7;color:#b45309}.badge.r{background:#fee2e2;color:#b91c1c}.badge.p{background:#ede9fe;color:#6d28d9}.badge.t{background:#ccfbf1;color:#0f766e}.badge.n{background:#eef2f8;color:#475569}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{filter:brightness(.95)}.btn.sec{background:#eaf0fb;color:var(--navy2)}.btn.dk{background:var(--navy)}.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:600;font-size:13px}
.tab.on{color:var(--navy2);border-bottom-color:var(--teal)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:11.5px;color:var(--mut);font-weight:600}
.pt-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pt-head .avatar{width:56px;height:56px;font-size:19px}
.kv2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.kv2 div{background:#f6f9fe;border-radius:10px;padding:9px 11px}.kv2 small{display:block;color:var(--mut);font-size:11px}.kv2 b{font-size:13px}
.tl{border-left:2px solid var(--line);margin-left:6px}
.tl div{position:relative;padding:0 0 16px 18px}
.tl div:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 1px var(--teal)}
.tl small{color:var(--mut)}
.week{display:grid;grid-template-columns:54px repeat(6,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.week .hd{background:#f6f9fe;padding:9px;text-align:center;font-weight:600;font-size:12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.week .hrs div{height:56px;font-size:11px;color:var(--mut);text-align:right;padding:3px 6px;border-top:1px solid #eef2f8}
.week .col{position:relative;border-left:1px solid var(--line);height:560px;background:repeating-linear-gradient(#fff 0 55px,#eef2f8 55px 56px)}
.ap{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 7px;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;color:#0a1a38;border-left:4px solid}
.ap b{display:block;font-size:11.5px}
.kan{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kcol{background:#eaf0fa;border-radius:12px;padding:10px;min-height:260px}
.kcol h4{font-size:12px;margin-bottom:9px;display:flex;justify-content:space-between}
.kc{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid var(--line);font-size:12.5px}
.kc small{color:var(--mut);display:block;margin-top:3px}
.bar{height:8px;border-radius:5px;background:#e8eef8;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.phone{width:290px;margin:auto;border:10px solid #101c3c;border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 12px 30px rgba(10,26,56,.25)}
.phone .ph{background:linear-gradient(120deg,var(--navy),#0b5e7a);color:#fff;padding:18px 16px}
.phone .pb{padding:14px;display:grid;gap:10px;background:#f6f9fe}
.phone .pi{background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line);font-size:12.5px}
.video{background:#0b1226;border-radius:14px;height:300px;position:relative;display:grid;place-items:center;color:#8fa3cf;overflow:hidden}
.video .me{position:absolute;right:14px;bottom:14px;width:130px;height:90px;border-radius:10px;background:#1b2a52;border:2px solid var(--teal);display:grid;place-items:center;font-size:11px}
.video .ctl{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.video .ctl span{width:38px;height:38px;border-radius:50%;background:#1f3266;display:grid;place-items:center;color:#fff;font-size:15px}
.video .ctl span.end{background:var(--bad)}
.tooth{cursor:pointer}
.tooth rect{stroke:#46618f;stroke-width:1.4;transition:fill .15s}
.tooth text{font-size:10px;fill:#17233c;text-anchor:middle;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid #46618f}
.chat{display:flex;flex-direction:column;height:430px}
.msgs{flex:1;overflow-y:auto;background:#f6f9fe;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px}
.m{max-width:86%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45}
.m.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.m.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.m.tr{align-self:flex-start;background:#ede9fe;color:#4c1d95;font-size:11.5px;font-family:Consolas,monospace}
.agent{display:flex;gap:12px;align-items:flex-start}
.agent .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.agent p{color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.4}
.disc{margin-top:26px;font-size:11.5px;color:var(--mut);text-align:center;line-height:1.5}
.tg{display:inline-block;width:34px;height:19px;border-radius:12px;background:#cbd5e5;position:relative;cursor:pointer;vertical-align:middle}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--teal)}.tg.on:after{left:17px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:none}
.price{font-size:28px;font-weight:800;color:var(--navy2)}.price small{font-size:12px;color:var(--mut);font-weight:400}
.plan.hl{border:2px solid var(--teal)}
ul.ck{list-style:none;margin:10px 0;display:grid;gap:6px}ul.ck li:before{content:"✓ ";color:var(--teal);font-weight:700}
.al{border:1px solid var(--line);border-left:4px solid #2563eb;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;background:#eff6ff;line-height:1.45}
.al.r{border-left-color:#dc2626;background:#fef2f2}.al.y{border-left-color:#f59e0b;background:#fffbeb}.al.g{border-left-color:#16a34a;background:#f0fdf4}
.adh{display:grid;grid-template-columns:140px repeat(14,1fr);gap:3px;align-items:center;margin-bottom:4px}
.adh .c{height:26px;border-radius:6px;cursor:pointer;text-align:center;font-size:11px;line-height:26px;user-select:none}.adh .c.on{background:#16a34a;color:#fff}.adh .c.off{background:#fecaca;color:#991b1b}
textarea{width:100%;resize:vertical}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12,.g3{grid-template-columns:1fr}.kan{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0}.burger{display:block}.g2{grid-template-columns:1fr}#view{padding:16px}}
@media print{aside,.top,.btn{display:none}main{margin:0}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 44 44"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#0fd3c0"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><rect width="44" height="44" rx="12" fill="#0e2250"/><path d="M22 22c-3-5-6.5-7-9.5-7a7 7 0 0 0 0 14c3 0 6.5-2 9.5-7zm0 0c3 5 6.5 7 9.5 7a7 7 0 0 0 0-14c-3 0-6.5 2-9.5 7z" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round"/><path d="M22 18v8M18 22h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    <div><b>NEXUS INFINITY<br>CORPORATION</b><small>NEXUS CLINIC · CONSULTORIO</small></div>
  </div>
  <nav class="nav" id="nav"></nav>
</aside>
<main>
  <div class="top">
    <button class="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
    <h1 id="ttl">Panel principal<small id="sub"></small></h1>
    <select id="role" onchange="state.role=this.value;toast('Rol activo: '+this.value);if(cur==='IA')go('IA')">
      <option>Médico</option><option>Recepción</option><option>Administrador</option>
    </select>
    <select id="sede"><option>Sede Central · La Paz</option><option>Sede Sur · Calacoto</option><option>Sede Santa Cruz</option></select>
    <div class="avatar">VQ</div>
  </div>
  <section id="view"></section>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const state={role:'Médico'};
let cur='HOME';
const badge=(t,c='b')=>`<span class="badge ${c}">${t}</span>`;
const kpi=(l,v,d,c='')=>`<div class="kpi"><div class="kl">${l}</div><div class="kv">${v}</div><div class="kd ${c}">${d}</div></div>`;
const tbl=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const card=(t,b,cls='')=>`<div class="card ${cls}"><h3>${t}</h3>${b}</div>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2300)};
const bars=(v,l,color='#00b3a4',h=170)=>{const w=400,n=v.length,bw=w/n,m=Math.max(...v)*1.15;return `<svg viewBox="0 0 ${w} ${h+22}" width="100%">${v.map((x,i)=>{const bh=x/m*h;return `<rect x="${i*bw+bw*.18}" y="${h-bh}" width="${bw*.64}" height="${bh}" rx="5" fill="${color}"/><text x="${i*bw+bw/2}" y="${h-bh-4}" font-size="10" text-anchor="middle" fill="#475569">${x}</text><text x="${i*bw+bw/2}" y="${h+14}" font-size="10.5" text-anchor="middle" fill="#6b7a96">${l[i]}</text>`}).join('')}</svg>`};
const line=(v,l,color='#2563eb',h=150,min=null,max=null)=>{const w=400,n=v.length,lo=min??Math.min(...v)*.9,hi=max??Math.max(...v)*1.05;const px=i=>20+i*(w-40)/(n-1),py=x=>h-(x-lo)/(hi-lo)*h+6;return `<svg viewBox="0 0 ${w} ${h+26}" width="100%"><polyline fill="none" stroke="${color}" stroke-width="2.6" points="${v.map((x,i)=>px(i)+','+py(x)).join(' ')}"/>${v.map((x,i)=>`<circle cx="${px(i)}" cy="${py(x)}" r="4" fill="#fff" stroke="${color}" stroke-width="2.2"/><text x="${px(i)}" y="${py(x)-9}" font-size="10" text-anchor="middle" fill="#475569">${x}</text><text x="${px(i)}" y="${h+22}" font-size="10.5" text-anchor="middle" fill="#6b7a96">${l[i]}</text>`).join('')}</svg>`};
const prog=(p,c='#00b3a4')=>`<div class="bar"><i style="width:${p}%;background:${c}"></i></div>`;
const act=(t,c='sec')=>`<button class="btn sm ${c}" onclick="toast('Demo: ${t}')">${t}</button>`;

/* ===== catálogo de módulos ===== */
const AREAS=[
 {id:'A',n:'Área A · Gestión clínica'},
 {id:'B',n:'Área B · Operaciones del consultorio'},
 {id:'C',n:'Área C · Administración y finanzas'},
 {id:'D',n:'Área D · Control, gestión y expansión'},
 {id:'E',n:'Área E · Módulos avanzados'}
];
const MODS=[
['M01','Registro y expediente del paciente','A','Alta de pacientes, datos demográficos, documento de identidad, seguro, contactos y expediente único.',['Búsqueda por CI / nombre','Detección de duplicados','Fotografía y adjuntos','Seguros y convenios','Datos de emergencia']],
['M02','Historia clínica electrónica','A','Registro estructurado de cada consulta: motivo, antecedentes, examen físico, evolución y plan, con firma electrónica.',['Motivo y enfermedad actual','Antecedentes, síntomas y examen','Evaluación, diagnósticos y plan','Evolución longitudinal','Plantillas por especialidad','IA: transcripción y borrador revisable','Firma y correcciones trazables']],
['M03','Diagnósticos, recetas y tratamientos','A','Diagnósticos con CIE-10, recetas digitales con alertas de alergias e interacciones y planes de tratamiento.',['Catálogo de diagnósticos configurable','Recetas completas','Indicaciones y restricciones','Plan y control de cumplimiento','Alergias e interacciones','Impresión y envío seguro','IA: verifica, no prescribe ni firma']],
['M04','Evaluación clínica y signos vitales','A','Captura de signos vitales, antropometría y escalas con gráficos de evolución y alertas por rangos.',['Presión, FC, FR, Temp, SpO₂','IMC automático','Gráficos de tendencia','Rangos de alerta','Escalas clínicas']],
['M05','Órdenes médicas y resultados','A','Solicitud de laboratorio, imágenes y procedimientos, con recepción y revisión de resultados.',['Órdenes de laboratorio e imagen','Estado de la orden','Resultados adjuntos','Valores fuera de rango','Revisión del médico']],
['M06','Agenda médica y citas','B','Agenda por profesional, consultorio y sede; citas, bloqueos, sobrecupos y recordatorios.',['Vista semanal / diaria','Citas recurrentes','Bloqueos y vacaciones','Sobrecupos','Recordatorios automáticos']],
['M07','Recepción y flujo de pacientes','B','Control de llegada, sala de espera y turnos hasta el alta, con tiempos de atención.',['Check-in','Sala de espera','Tiempos de espera','Asignación de consultorio','Alta y cobro']],
['M08','Comunicación y seguimiento','B','Mensajes, recordatorios y seguimiento posconsulta por WhatsApp, SMS y correo, con plantillas.',['Plantillas de mensajes','Recordatorio de citas','Seguimiento posconsulta','Campañas de control','Registro de envíos']],
['M09','Telemedicina','B','Videoconsulta integrada a la agenda y a la historia clínica, con sala virtual y consentimiento.',['Sala de video','Chat y archivos','Registro en la HCE','Consentimiento previo','Receta remota']],
['M10','Caja, facturación y pagos','C','Cobros, arqueo de caja, facturación electrónica, pagos parciales y cuentas por cobrar.',['Caja diaria y arqueo','Facturación electrónica','QR, tarjeta, efectivo','Pagos parciales','Cuentas por cobrar']],
['M11','Inventario e insumos médicos','C','Control de insumos y medicamentos con stock mínimo, lotes, vencimientos y consumo por procedimiento.',['Stock mínimo','Lotes y vencimientos','Kardex','Consumo por procedimiento','Órdenes de compra']],
['M12','Contabilidad y gastos','C','Ingresos, egresos, gastos fijos y variables, y conciliación con el sistema contable.',['Plan de cuentas','Registro de gastos','Cuentas por pagar','Flujo de caja','Exportación contable']],
['M13','Personal y profesionales','C','Fichas de profesionales y personal, horarios, comisiones y honorarios por servicio.',['Ficha de profesionales','Matrícula y especialidad','Horarios y turnos','Honorarios y comisiones','Documentos del personal']],
['M14','Reportes e inteligencia de negocio (BI)','D','Tableros de gestión: pacientes, ingresos, productividad, ocupación y retención.',['Tablero ejecutivo','Productividad por médico','Ocupación de agenda','Diagnósticos frecuentes','Exportación']],
['M15','Administración del sistema','D','Usuarios, roles y permisos, parámetros del consultorio, copias de seguridad y catálogos.',['Roles y permisos','Parámetros generales','Catálogos','Respaldos','Registro de sesiones']],
['M16','Portal del paciente','D','Acceso del paciente a sus citas, resultados, recetas y pagos desde web o móvil.',['Reserva en línea','Resultados y recetas','Pagos en línea','Mensajes','Documentos']],
['M17','Derivaciones y continuidad asistencial','D','Referencia y contrarreferencia a especialistas, laboratorios y hospitales con seguimiento.',['Referencia / contrarreferencia','Resumen clínico','Estado de la derivación','Red de centros','Alta y retorno']],
['M18','Consentimiento, documentos y auditoría clínica','D','Consentimientos informados, documentos firmados y trazabilidad de accesos y cambios al expediente.',['Consentimientos digitales','Firma electrónica','Control de versiones','Bitácora de accesos','Auditoría clínica']],

function iaFlags(n){
 const f=[],v=HCE.vit;
 if(n>=1)f.push(['Pendiente','Evaluación clínica y diagnósticos no fueron dictados. Los define el médico; la IA no los propone.']);
 if(n>=1)f.push(['Pendiente','No se conversó sobre tabaquismo ni antecedentes familiares. Se mantiene lo registrado antes.']);
 if(n>=6){const l=Math.round(EXP.adh.l.reduce((a,b)=>a+b,0)/14*100),a=Math.round(EXP.adh.a.reduce((a,b)=>a+b,0)/14*100);f.push(['Verificar','El paciente dijo "casi todos los días". El registro de cumplimiento muestra '+l+'% en losartán y '+a+'% en atorvastatina.'])}
 if(n>=12)f.push(EXP.alg.some(a=>/penicilin/i.test(a[0]))?['Coincide','La alergia a penicilina mencionada ya está registrada en el expediente.']:['Verificar','Se mencionó alergia a penicilina que no está registrada. Revise el expediente.']);
 if(n>=13)f.push(v.sis===148&&v.dia===94&&v.fc===78?['Coincide','Presión 148/94 y pulso 78 dictados coinciden con los signos vitales registrados.']:['Verificar','Los valores dictados (148/94, pulso 78) difieren de los signos vitales registrados ('+v.sis+'/'+v.dia+', FC '+v.fc+').']);

 const i=$('#q'),t=i.value.trim();if(!t)return;i.value='';addMsg('u',t);

}
